<div class="search-bar">
  <input type="text" [(ngModel)]="searchQuery" placeholder="Поиск сериала..." />
  <button (click)="searchSeries()">🔍 Найти</button>
</div>

<div class="series-grid">
  <div class="series-card" *ngFor="let show of series()">
    <img
      [src]="'https://image.tmdb.org/t/p/w500' + show.poster_path"
      [alt]="show.name"
      class="poster"
    />
    <h3>{{ show.name }}</h3>
    <p>Дата выхода: {{ show.first_air_date }}</p>
    <p>Рейтинг: {{ show.vote_average }}</p>
    <button class="addToFavoritesButton" (click)="addToFavorites(show)">⭐ В избранное</button>
  </div>
</div>

<div class="pagination">
  <button (click)="prevPage()" [disabled]="currentPage() === 1">Назад</button>
  <span>Страница {{ currentPage() }} из {{ totalPages() }}</span>
  <button (click)="nextPage()" [disabled]="currentPage() === totalPages()">Вперёд</button>
</div>
